<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1080" height="700" fill="#ffffff"/>

  <!-- 顶层：用户 -->
  <rect x="420" y="16" width="240" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="540" y="45" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">值班人员 / 客户端</text>

  <line x1="540" y1="62" x2="540" y2="98" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 接入层：FastAPI -->
  <rect x="300" y="100" width="480" height="80" rx="12" fill="#eaf2fc" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="540" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#1a5fb4">FastAPI 服务（:8001）</text>
  <g font-size="12" fill="#1f2328">
    <rect x="322" y="140" width="88" height="26" rx="13" fill="#ffffff" stroke="#a5c4ea"/>
    <text x="366" y="157" text-anchor="middle">/classify</text>
    <rect x="418" y="140" width="82" height="26" rx="13" fill="#ffffff" stroke="#a5c4ea"/>
    <text x="459" y="157" text-anchor="middle">/assist</text>
    <rect x="508" y="140" width="140" height="26" rx="13" fill="#ffffff" stroke="#a5c4ea"/>
    <text x="578" y="157" text-anchor="middle">/eval（token 校验）</text>
    <rect x="656" y="140" width="76" height="26" rx="13" fill="#ffffff" stroke="#a5c4ea"/>
    <text x="694" y="157" text-anchor="middle">/health</text>
  </g>

  <!-- 公网防护 -->
  <rect x="800" y="104" width="250" height="72" rx="10" fill="#fff8e6" stroke="#d4a72c"/>
  <text x="925" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9a6700">公网防护</text>
  <text x="925" y="151" text-anchor="middle" font-size="12" fill="#6a530f">单 IP 限速 20 次/分钟</text>
  <text x="925" y="168" text-anchor="middle" font-size="12" fill="#6a530f">/eval token 校验</text>

  <!-- 分流箭头 -->
  <line x1="400" y1="180" x2="330" y2="226" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="680" y1="180" x2="750" y2="226" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 左：根因分类 Agent -->
  <rect x="40" y="230" width="500" height="300" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <rect x="40" y="230" width="500" height="42" rx="12" fill="#1a5fb4"/>
  <rect x="40" y="258" width="500" height="14" fill="#1a5fb4"/>
  <text x="290" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">根因分类 Agent · /classify</text>

  <text x="64" y="296" font-size="12.5" fill="#57606a">输入：卡单事件结构化上下文（error_message / 错误码 / 等待时长）</text>

  <text x="64" y="324" font-size="13" font-weight="700" fill="#1a5fb4">LLM 容灾链（按序降级）</text>
  <g font-size="12" fill="#1f2328">
    <rect x="64" y="336" width="92" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="110" y="358" text-anchor="middle">DeepSeek</text>
    <rect x="176" y="336" width="112" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="232" y="358" text-anchor="middle">GLM-4-Flash（免费）</text>
    <rect x="308" y="336" width="104" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="360" y="358" text-anchor="middle">Qwen（免费）</text>
    <rect x="432" y="336" width="84" height="36" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="474" y="358" text-anchor="middle" fill="#1a7f37">规则基线</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.4">
    <line x1="156" y1="354" x2="174" y2="354" marker-end="url(#arr)"/>
    <line x1="288" y1="354" x2="306" y2="354" marker-end="url(#arr)"/>
    <line x1="412" y1="354" x2="430" y2="354" marker-end="url(#arr)"/>
  </g>
  <text x="64" y="398" font-size="11.5" fill="#6e7781">400 / 超时自动切换 · JSON 模式不兼容时宽松提取 · 全链失败落规则基线</text>

  <rect x="64" y="416" width="416" height="32" rx="8" fill="#fff1e5" stroke="#d4a72c"/>
  <text x="272" y="437" text-anchor="middle" font-size="12" fill="#9a6700">置信度门禁：&lt; 0.85 → needs_human_review（人工复核）</text>

  <rect x="56" y="466" width="468" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="290" y="492" text-anchor="middle" font-size="12.5" fill="#1f2328">输出：<tspan font-weight="700">根因类别 + 置信度 + 证据 + 处置建议</tspan></text>

  <!-- 右：RAG 值班助手 -->
  <rect x="580" y="230" width="460" height="300" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <rect x="580" y="230" width="460" height="42" rx="12" fill="#1a5fb4"/>
  <rect x="580" y="258" width="460" height="14" fill="#1a5fb4"/>
  <text x="810" y="257" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RAG 值班助手 · /assist</text>

  <text x="604" y="296" font-size="12.5" fill="#57606a">输入：自然语言值班提问</text>

  <text x="604" y="324" font-size="13" font-weight="700" fill="#1a5fb4">主链路（向量检索）</text>
  <g font-size="12" fill="#1f2328">
    <rect x="604" y="336" width="118" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="663" y="352" text-anchor="middle">提问 Embedding</text>
    <text x="663" y="367" text-anchor="middle" font-size="10.5" fill="#6e7781">JSONL 缓存</text>
    <rect x="742" y="336" width="122" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="803" y="352" text-anchor="middle">余弦相似度</text>
    <text x="803" y="367" text-anchor="middle" font-size="10.5" fill="#6e7781">Top-3 相似工单</text>
    <rect x="884" y="336" width="132" height="36" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="950" y="352" text-anchor="middle">LLM 总结</text>
    <text x="950" y="367" text-anchor="middle" font-size="10.5" fill="#6e7781">处置建议</text>
  </g>
  <g stroke="#8b949e" stroke-width="1.4">
    <line x1="722" y1="354" x2="740" y2="354" marker-end="url(#arr)"/>
    <line x1="864" y1="354" x2="882" y2="354" marker-end="url(#arr)"/>
  </g>

  <text x="604" y="402" font-size="12" fill="#9a6700">降级①　Embedding 不可用 → 关键词宽召回(8) + LLM 重排</text>
  <text x="604" y="424" font-size="12" fill="#9a6700">降级②　LLM 不可用 → 直接返回原始 case</text>

  <rect x="596" y="466" width="428" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="810" y="492" text-anchor="middle" font-size="12.5" fill="#1f2328">采信阈值：相似度 &lt; 0.55 → <tspan font-weight="700">提示人工判断，不硬答</tspan></text>

  <!-- 底层箭头 -->
  <line x1="290" y1="530" x2="290" y2="576" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="810" y1="530" x2="810" y2="576" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 数据层 -->
  <rect x="40" y="580" width="640" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="64" y="608" font-size="14" font-weight="700" fill="#1f2328">数据层</text>
  <text x="64" y="634" font-size="12.5" fill="#1f2328"><tspan font-family="Menlo,monospace" fill="#1a5fb4">incidents.jsonl</tspan>　评测集 100 条（5 类 × 20，固定随机种子可复现）</text>
  <text x="64" y="658" font-size="12.5" fill="#1f2328"><tspan font-family="Menlo,monospace" fill="#1a5fb4">kb_tickets.jsonl</tspan>　历史 oncall 工单知识库 30 条</text>

  <!-- 评测与可观测 -->
  <rect x="720" y="580" width="320" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="744" y="608" font-size="14" font-weight="700" fill="#1f2328">评测与可观测</text>
  <text x="744" y="634" font-size="12.5" fill="#1f2328">/eval：准确率 · 分类别指标 · 延迟</text>
  <text x="744" y="658" font-size="12.5" fill="#1f2328">/health：生效通道（source / llm_provider）</text>
</svg>
